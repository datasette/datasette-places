[project]
name = "datasette-places"
version = "0.0.1a2"
description = "Datasette plugin for creating and sharing lists of places on a map"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Framework :: Datasette"
]
requires-python = ">=3.10"
dependencies = [
    "datasette>1a",
    "datasette-acl>=0.6a0",
    "datasette-acl-share>=0.0.1a4",
    "datasette-plugin-router>=0.0.1a3",
    "datasette-vite>=0.0.1a4",
    "sqlite-migrate>=0.1b0",
    "sqlite-utils>=3.38",
    "httpx>=0.27",
]

[dependency-groups]
# datasette-debug-gotham gives `just dev` one-click login as demo actors
# (Clark, Bruce, …) so the share flow — owner Manager grant, per-actor grants,
# the authenticated/everyone public audiences — can be exercised by hand.
dev = [
    "datasette-debug-gotham>=0.1.0a3",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.15.0",
    # solite provides the `codegen` CLI used by `just codegen-queries` to
    # compile datasette_places/sql/queries.sql into typed Python helpers.
    "solite>=0.0.1a36",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.entry-points.datasette]
places = "datasette_places"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["datasette_places*"]

[tool.setuptools.package-data]
datasette_places = ["static/**/*", "templates/**/*", "manifest.json"]
